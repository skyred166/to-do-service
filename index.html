<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сервис To-Do</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <div class="container">
      <h1 class="title">📋 Список дел</h1>
      
      <form class="to-do__form" id="to-do-form">
        <div class="form-group">
          <input 
            type="text" 
            class="to-do__input" 
            id="to-do-input" 
            placeholder="Введите новую задачу..."
            required
          >
          <textarea 
            class="to-do__input to-do__input_type_description" 
            id="to-do-description" 
            placeholder="Описание (опционально)"
            rows="3"
          ></textarea>
          <input 
            type="datetime-local" 
            class="to-do__input to-do__input_type_schedule" 
            id="to-do-schedule"
          >
          <button type="submit" class="to-do__button to-do__button_type_add">Добавить</button>
        </div>
      </form>

      <div class="to-do__stats">
        <span id="total-tasks">Всего: 0</span>
        <span id="completed-tasks">Выполнено: 0</span>
      </div>

      <p class="to-do__hint">💡 Перетаскивайте задачи для изменения порядка</p>

      <ul class="to-do__list" id="to-do-list"></ul>
    </div>
  </div>

  <!-- Модальное окно для детального просмотра задачи -->
  <div class="modal modal--hidden" id="task-modal">
    <div class="modal__overlay" id="modal-overlay"></div>
    <div class="modal__content">
      <div class="modal__header">
        <h2 class="modal__title">Детали задачи</h2>
        <button class="modal__close" id="modal-close">&times;</button>
      </div>
      <div class="modal__body">
        <div class="modal__field">
          <label class="modal__label">Название:</label>
          <p class="modal__text" id="modal-title"></p>
        </div>
        <div class="modal__field">
          <label class="modal__label">Описание:</label>
          <p class="modal__description" id="modal-description"></p>
        </div>
        <div class="modal__field">
          <label class="modal__label">Расписание:</label>
          <p class="modal__text" id="modal-schedule"></p>
        </div>
        <div class="modal__field">
          <label class="modal__label">Статус:</label>
          <p class="modal__text" id="modal-status"></p>
        </div>
      </div>
      <div class="modal__footer">
        <button class="modal__button modal__button_type_close" id="modal-close-button">Закрыть</button>
      </div>
    </div>
  </div>

  <template id="to-do__item-template">
    <li class="to-do__item" data-task-id="" draggable="true">
      <div class="to-do__drag-handle">≡</div>
      <input type="checkbox" class="to-do__item-checkbox" aria-label="Отметить выполненной">
      <div class="to-do__item-content">
        <span class="to-do__item-text"></span>
        <span class="to-do__item-description"></span>
        <span class="to-do__item-schedule"></span>
      </div>
      <button class="to-do__item-button to-do__item-button_type_view" aria-label="Просмотр деталей"></button>
      <button class="to-do__item-button to-do__item-button_type_edit" aria-label="Редактировать"></button>
      <button class="to-do__item-button to-do__item-button_type_duplicate" aria-label="Копировать"></button>
      <button class="to-do__item-button to-do__item-button_type_delete" aria-label="Удалить"></button>
    </li>
  </template>

  <script src="index.js"></script>
</body>
</html>
